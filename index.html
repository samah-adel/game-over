<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Browse free online games, read reviews, explore categories, and view detailed information about MMORPG, Shooter, Pixel, and more.">
    <meta name="keywords" content="games, free games, mmorpg, shooter, pixel, game reviews, online games">
    <title>Game Over</title>

    <!-- google font links -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&family=Comic+Neue:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&display=swap"
        rel="stylesheet">

    <!-- fontawome css -->
    <link rel="stylesheet" href="./css/all.min.css">
    <!-- bootstrap css -->
    <link rel="stylesheet" href="./css/bootstrap.min.css">
    <!-- main file css -->
    <link rel="stylesheet" href="./css/style.css">
</head>


<body class=" bg-dark">


    <section class="games" id="games">
        <header>
            <img src="./imges/wraper (1).png" alt="game photo" class="w-100">
        </header>
        <nav class="navbar navbar-expand-lg position-sticky top-0">
            <div class="container">
                <h5 class="navbar-brand text-uppercase">
                    <img src="./imges/logo-sm.png" alt="logo photo"> Game Reviews
                </h5>
                <button class="navbar-toggler collapsed" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
                    aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>


                <div class="small navbar-collapse collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav ms-auto mb-2 mb-lg-0  ">
                        <li class="nav-item">
                            <a class="nav-link active text-uppercase" id="mmorpg">mmorpg</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-uppercase" id="shooter">shooter</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-uppercase" id="sailing">sailing</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-uppercase" id="permadeath">permadeath</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-uppercase" id="superhero">superhero</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-uppercase" id="pixel">pixel</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
        <!-- display-crid py-5    sec -->
        <main class="container my-5">
            <section class="position-relative" id="display-card">

                <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 row-cols-xl-4 g-4" id="card-body">
                    <div class="col" id="click-details">
                        <div class="card p-4 bg-dark text-white"></div>
                    </div>
                </div>



            </section>
        </main>

    </section>






    <section class="details d-none" id="details">

        <div class="container bg-dark text-white" id="detailsContainer">
            <header class="hstack justify-content-between">
                <h1 class="text-center h3 py-4">Details Game</h1>
                <button class="btn-close btn-close-white" id="btnClose"></button>
            </header>
            <div class="row g-4">
                <div class="col-md-6">
                    <div class="row g-4" id="detailsContent">
                        <div class="col-md-4">
                            <img src="https://www.freetogame.com/g/226/thumbnail.jpg" class="w-100" alt="image details">
                        </div>
                        <div class=" col-md-8">
                            <h3>Title: Path of Exile</h3>
                            <p>Category: <span class="badge text-bg-info"> MMORPG</span> </p>
                            <p>Platform: <span class="badge text-bg-info"> Windows</span> </p>
                            <p>Status: <span class="badge text-bg-info"> Live</span> </p>
                            <p class="small">
                            </p>
                            <a class="btn btn-outline-warning" target="_blank"
                                href="https://www.freetogame.com/open/path-of-exile">Show Game</a>
                        </div>

                    </div>
                </div>

            </div>
        </div>


    </section>

    <div id="loading" class="d-none loading ">
        <span class="loader"></span>
        <span class="loader-reverse"></span>
    </div>




    <!------------------ Bootstrap js ----------------------->
    <script src="./js/bootstrap.bundle.min.js"></script>
    <!------------------------ js file----------------------->

    <script type="module" src="./js/main.js"></script>
    <!-- <script type="module" src="./js/ui.js"></script> -->
</body>

</html>
